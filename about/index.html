<style>
  :root{
    --bg:#FAFAF9; --ink:#22262B; --body:#3E454C; --sub:#5E666E;
    --rule:#DDE0E2; --band:#E6E8EA; --band-rule:#CDD1D5;
    --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--serif);
       font-size:15px;line-height:2;letter-spacing:.08em}
  a{color:var(--ink)}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

  .nav{display:flex;justify-content:space-between;align-items:center;gap:16px;
       max-width:44rem;margin:0 auto;padding:24px}
  .nav .brand{font-size:14px;letter-spacing:.3em;text-decoration:none;color:var(--ink)}
  .nav a.to{font-size:12px;letter-spacing:.14em;color:var(--sub);text-decoration:none;
            border-bottom:1px solid var(--rule);padding-bottom:2px}

  /* 最初の画面：言うことは1つ */
  .hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center;
        max-width:44rem;margin:0 auto;padding:40px 24px 72px}
  .hero .who{margin:0 0 28px;font-size:12px;letter-spacing:.25em;color:var(--sub)}
  h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:400;color:var(--ink);
     line-height:1.7;letter-spacing:.14em}
  .hero .sub{margin:36px 0 0;font-size:15px;color:var(--body)}
  .hero .go{margin:44px 0 0}

  .band{padding:96px 24px}
  .band > .inner{max-width:44rem;margin:0 auto}
  .tone{background:var(--band)}
  .label{margin:0 0 20px;font-size:12px;font-weight:600;letter-spacing:.3em;color:var(--sub)}
  h2{margin:0 0 36px;font-size:clamp(19px,3vw,24px);font-weight:400;color:var(--ink);
     letter-spacing:.14em;line-height:1.8}
  p{margin:0 0 1.2em}

  /* 任せられること：3つ */
  .three{margin:0;padding:0;list-style:none}
  .three li{padding:26px 0;border-top:1px solid var(--band-rule)}
  .three li:last-child{border-bottom:1px solid var(--band-rule)}
  .three b{display:block;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.16em;margin-bottom:4px}
  .three span{font-size:14.5px}

  /* 流れ：4つ */
  .steps{counter-reset:s;list-style:none;margin:0;padding:0}
  .steps li{counter-increment:s;position:relative;padding:20px 0 20px 3.4em;border-top:1px solid var(--band-rule)}
  .steps li:last-child{border-bottom:1px solid var(--band-rule)}
  .steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:22px;
                    font-size:12px;letter-spacing:.2em;color:var(--sub)}
  .steps b{font-weight:600;color:var(--ink);letter-spacing:.14em}
  .steps span{display:block;font-size:14px}

  .facts{margin:0;padding:0;list-style:none}
  .facts li{padding:16px 0;border-top:1px solid var(--rule)}
  .facts li:last-child{border-bottom:1px solid var(--rule)}

  .faq dt{margin:28px 0 4px;font-weight:600;color:var(--ink);letter-spacing:.12em}
  .faq dt:first-child{margin-top:0}
  .faq dd{margin:0}

  .small{font-size:13.5px;color:var(--sub)}
  .todo{display:inline-block;margin:0 0 1em;padding:4px 10px;border:1px dashed #B08A2E;background:#FBF6E8;
        font-size:12px;line-height:1.7;color:#6B5215;letter-spacing:.02em;font-family:sans-serif}

  .contact{text-align:center}
  .contact h2{margin-bottom:20px}
  .contact p{font-size:14px;color:var(--sub);margin-bottom:36px}
  .mail{display:inline-block;font-size:14px;letter-spacing:.12em;text-decoration:none;color:var(--ink);
        background:#FFFFFF;border:1px solid var(--ink);padding:16px 48px;transition:all .3s ease}
  .tone .mail{border-color:#FFFFFF}
  .mail:hover,.mail:focus-visible{background:#6E747A;color:#FFFFFF;border-color:#6E747A}

  .contact p.who-runs{margin:40px 0 0;font-size:12.5px;letter-spacing:.12em}
  .who-runs a{color:var(--sub);text-decoration:none;border-bottom:1px dotted var(--sub);padding-bottom:1px}
  .who-runs a:hover,.who-runs a:focus-visible{color:var(--ink);border-bottom:1px solid var(--ink)}
  .who-runs span{margin-left:.4em}
  footer{text-align:center;padding:0 24px 64px;font-size:12px;color:var(--sub);letter-spacing:.2em;line-height:2.2}
  footer p{margin:0}
  footer a{color:var(--sub)}

  @media (max-width:600px){
    .hero{min-height:68vh;padding:24px 20px 56px}
    .band{padding:72px 20px}
    .nav{padding:20px}
    .mail{padding:16px 24px;width:100%;text-align:center}
  }

  /* 相談フォームへの入口・フッターの案内 */
  .contact p.req{margin:24px 0 0;font-size:13px;letter-spacing:.12em}
  .req a,.fnav a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
  .req a:hover,.fnav a:hover{color:var(--ink);border-color:var(--ink)}
  footer p.fnav{margin:0 0 1.6em;font-size:12px;letter-spacing:.12em;line-height:2.4}
  .fnav .sep{margin:0 .8em;color:var(--rule)}
  /* 文書のページ（運営者情報・個人情報・読み物） */
  .page{max-width:44rem;margin:0 auto;padding:40px 24px 96px}
  .page h1{font-size:clamp(22px,4vw,30px);margin:0 0 12px}
  .page .lead{margin:0 0 48px;color:var(--sub);font-size:14px}
  .doc h2{margin:56px 0 16px;font-size:17px;font-weight:600;letter-spacing:.14em;line-height:1.8}
  .doc ul,.doc ol{margin:0 0 1.2em;padding-left:1.4em}
  .doc li{margin:0 0 .4em}
  .info{margin:0}
  .info div{padding:18px 0;border-top:1px solid var(--rule)}
  .info div:last-child{border-bottom:1px solid var(--rule)}
  .info dt{font-size:12px;letter-spacing:.2em;color:var(--sub);margin:0 0 4px}
  .info dd{margin:0}
  /* 相談フォーム */
  .form fieldset{border:0;border-top:1px solid var(--rule);margin:0;padding:24px 0}
  .form legend{padding:0;font-weight:600;color:var(--ink);letter-spacing:.12em;float:left;width:100%;margin:0 0 12px}
  .form legend + *{clear:both}
  .form label.opt{display:inline-block;margin:0 1.2em .4em 0;font-size:14.5px}
  .form input[type=text],.form textarea{width:100%;font:inherit;letter-spacing:.04em;color:var(--ink);background:#fff;
      border:1px solid var(--band-rule);padding:10px 12px;border-radius:0}
  .form textarea{min-height:8em;line-height:1.8}
  .form input:focus-visible,.form textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .form .actions{padding:32px 0 0;border-top:1px solid var(--rule);text-align:center}
  .form button{font:inherit;font-size:14px;letter-spacing:.12em;cursor:pointer;color:var(--ink);background:#fff;
      border:1px solid var(--ink);padding:16px 40px;margin:0 6px 12px;transition:all .3s ease}
  .form button:hover,.form button:focus-visible{background:#6E747A;color:#fff;border-color:#6E747A}
  .form .note{font-size:13px;color:var(--sub);margin:16px 0 0}
  #out{display:none;margin-top:24px}
  .em label{cursor:pointer}
  .em input{margin-right:.5em;vertical-align:middle}
</style>
</head>
<body>

<nav class="nav" aria-label="サイト内">
  <a class="brand" href="/">トキノアト</a>

</nav>

<main>
  <div class="page">
    <h1>運営者情報</h1>
    <p class="lead">トキノアトの運営者についてのご案内です。</p>
    <dl class="info">
      <div><dt>屋号</dt><dd>トキノアト（TOKINOATO）</dd></div>
      <div><dt>代表</dt><dd>高田ナオキ（公益社団法人 日本広告写真家協会（APA）正会員）</dd></div>
      <div><dt>所在地</dt><dd>愛知県名古屋市</dd></div>
      <div><dt>事業内容</dt><dd>広告撮影、美術品撮影、撮影ディレクション<br>会社案内・採用ページ・動画の制作</dd></div>
      <div><dt>対応地域</dt><dd>名古屋を中心に、東海三県（愛知・岐阜・三重）<br>撮影内容によっては全国</dd></div>
      <div><dt>連絡先</dt><dd><span class="em"><label><input type="checkbox"> 私はロボットではありません（チェックでメールアドレスを表示）</label></span></dd></div>
    </dl>
    <p class="small" style="margin-top:2.4em"><a href="/#h-profile">代表の経歴を見る →</a></p>
  </div>
</main>

<footer>
  <p class="fnav"><a href="/about/">運営者情報</a><span class="sep" aria-hidden="true">／</span><a href="/privacy/">個人情報の取り扱い</a><span class="sep" aria-hidden="true">／</span><a href="/guide/estimate/">見積もりの考え方</a></p>
  <p><a href="/">トキノアト</a></p>
  <p lang="en">Photography &amp; Creative Production</p>
</footer>

<script>
(function(){
  var a=['contact','tokinoato.com'].join('@');
  document.querySelectorAll('.em').forEach(function(w){
    var c=w.querySelector('input');
    c.addEventListener('change',function(){
      if(!c.checked)return;
      var l=document.createElement('a');l.href='mailto:'+a;l.textContent=a;
      w.textContent='';w.appendChild(l);
    });
  });
})();
</script>
